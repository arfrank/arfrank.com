<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#000000">
		<title>Aaron Frank</title>
		<meta name="description" content="Aaron Frank — personal site.">

		<meta property="og:type" content="website">
		<meta property="og:title" content="Aaron Frank">
		<meta property="og:url" content="https://www.arfrank.com/">

		<link rel="icon" href="/favicon.ico">
		<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="/style.css?v=8">
	</head>
	<body>
		<div class="bg-stack" aria-hidden="true">
			<div class="bg-layer" id="bg-a"></div>
			<div class="bg-layer" id="bg-b"></div>
		</div>
		<div class="bg-overlay" aria-hidden="true"></div>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<main class="stage">
			<div class="content">
				<h1 class="wordmark">Aaron&nbsp;&nbsp;Frank</h1>
				<ul class="nav-links">
					<li><a href="https://x.com/arfrank">X</a></li>
					<li><a href="https://www.linkedin.com/in/arfrank/">LinkedIn</a></li>
					<li><a href="https://www.getFinal.com">Final</a></li>
					<li><a href="/wood/">Wood</a></li>
				</ul>
			</div>
		</main>

		<aside class="caption" aria-label="Photo location">
			<a class="caption__place" id="info_text" target="_blank" rel="noopener"></a>
			<div class="caption__meta">
				<span class="caption__coords" id="info_coords"></span>
				<span class="caption__sep" aria-hidden="true">·</span>
				<span class="caption__year">© <span id="year"></span></span>
			</div>
		</aside>

		<div class="bg-controls">
			<span class="bg-count" id="bg-count" aria-hidden="true"></span>
			<button id="change_bg" class="reload" type="button" aria-label="Change background image" title="Next photo (or press →)">
				<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 12a9 9 0 1 0 3-6.7"/>
					<path d="M3 4v5h5"/>
				</svg>
			</button>
		</div>

		<script src="/script.js?v=4"></script>
	</body>
</html>
